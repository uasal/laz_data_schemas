[project]
name = "laz_data_schemas"
description = "Core schemas used for esc pipelines."
requires-python = ">=3.9"
classifiers = [ "Programming Language :: Python :: 3" ]
dynamic = ["version"]
dependencies = [
  'astropy',
  'jsonschema'
]

[project.license]
file = "LICENSE"
content-type = "text/plain"

[build-system]
requires = [ "setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"


[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }


[tool.setuptools_scm]
write_to = "src/_version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""
