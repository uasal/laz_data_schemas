$schema: http://json-schema.org/draft-2020-12/schema#
$id: dark_image_schema.yaml
title: Science Image Dark Schema 
description: Definition of the dark image schema
type: object
required: [NAXIS, NAXIS1, NAXIS2, data]
properties:
  meta:
    $ref: 'reference.yaml' 
  NAXIS:
    type: object
    properties:
      value:
        type: integer
      description:
        type: string
        default: Number of array dimensions
  NAXIS1:
    type: object
    properties:
      value:
        type: integer
      description:
        type: string
        default: size of x axis
  NAXIS2:
    type: object
    properties:
      value:
        type: integer
      description:
        type: string
        default: size of y axis  
  data:
    type: array
    description: Represents 2D dark array
    items:
      type: array
      items:
       type: number
