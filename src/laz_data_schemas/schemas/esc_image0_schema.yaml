$schema: http://json-schema.org/draft-2020-12/schema#
$id: esc_image0_schema.yaml
title: Science Image Level 0 Schema 
description: Definition of the science image level 0 FITS file and metadata. Extensions are zero indexed.
type: object
required: [NAXIS, NAXIS1, NAXIS2, data]
properties:
  meta:
    $ref: 'core_schema.yaml' 
  NAXIS:
    type: object
    properties:
      value:
        type: integer
      description:
        type: string
        default: Number of array dimensions
  NAXIS1:
    type: object
    properties:
      value:
        type: integer
      description:
        type: string
        default: size of x axis
  NAXIS2:
    type: object
    properties:
      value:
        type: integer
      description:
        type: string
        default: size of y axis  
  data:
    type: array
    description: Represents 2D science data array
    items:
      type: array
      items:
       type: number
